name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          for route in skincare body-care bundles about search cart checkout products; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          for product_id in $(grep -oE "id: '[^']+'" src/data/products.js | cut -d"'" -f2); do
            mkdir -p "dist/products/$product_id"
            cp dist/index.html "dist/products/$product_id/index.html"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
