<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://tropitwist.vercel.app/" />
    <title>Tropitwist has moved</title>
    <style>
      body { align-items: center; background: #fff8e8; color: #1f1a17; display: flex; font-family: system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; text-align: center; }
      main { max-width: 34rem; padding: 2rem; }
      a { background: #c93645; border-radius: 999px; color: white; display: inline-block; font-weight: 700; margin-top: 1rem; padding: .9rem 1.4rem; text-decoration: none; }
    </style>
    <script>
      (() => {
        const canonicalOrigin = 'https://tropitwist.vercel.app';
        const path = window.location.pathname.replace(/^\/Tropitwist(?=\/|$)/, '') || '/';
        window.location.replace(`${canonicalOrigin}${path}${window.location.search}${window.location.hash}`);
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>Tropitwist has moved</h1>
      <p>Continue to the secure storefront to shop or access your account.</p>
      <a href="https://tropitwist.vercel.app/">OPEN TROPITWIST</a>
    </main>
  </body>
</html>
