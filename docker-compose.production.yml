services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tropitwist
      POSTGRES_USER: tropitwist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tropitwist-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tropitwist -d tropitwist"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://tropitwist:${POSTGRES_PASSWORD}@database:5432/tropitwist
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL_MINUTES: 15
      SESSION_TTL_DAYS: 30
    ports:
      - "4000:4000"

volumes:
  tropitwist-postgres:
